# Deploys the FastAPI backend to Fly.io (app: marketcap-backend).
#
# Trigger: every push to main that touches backend/, or manually via the
# "Run workflow" button (workflow_dispatch).
#
# Requires the FLY_API_TOKEN repository secret (Settings → Secrets and
# variables → Actions). Create the token with:
#   fly tokens create deploy -a marketcap-backend
# or from the Fly.io dashboard → marketcap-backend → Tokens.
#
# The frontend needs no workflow — Vercel deploys it automatically on push.

name: Fly Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN is configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set. Create a deploy token with 'fly tokens create deploy -a marketcap-backend' and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Preflight gate — the same checks scripts/deploy.sh runs locally
      # (JWT strength + a real DATABASE_URL connection + SELECT 1), so a
      # rotated or broken credential is blocked HERE instead of surfacing
      # as a degraded production machine. Runs only when the DATABASE_URL
      # and JWT_SECRET repository secrets are configured (they should
      # mirror the Fly secrets); otherwise it is skipped with a notice.
      - name: Preflight (DB + JWT checks)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$JWT_SECRET" ]; then
            echo "::notice::DATABASE_URL / JWT_SECRET secrets not configured — skipping preflight. Add them (mirroring the Fly secrets) to gate deploys on a live DB check."
            exit 0
          fi
          python3 -m pip install --quiet "sqlalchemy>=2" psycopg2-binary
          python3 backend/scripts/preflight.py

      # Pinned to the commit behind tag 1.6 — this job holds FLY_API_TOKEN,
      # so a mutable ref (@master) would let an upstream push run arbitrary
      # code with secret access on our next deploy.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # --remote-only builds the image on Fly's builders, so the runner
      # doesn't need Docker. fly.toml lives in backend/.
      - name: Deploy
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Verify health
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://marketcap-backend.fly.dev/health || true)
            echo "attempt $i: /health → $code"
            if [ "$code" = "200" ]; then
              echo "Backend healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend /health did not return 200 within 2 minutes of deploy."
          exit 1
